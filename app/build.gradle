plugins {
    id 'com.android.application'
}

android {
    namespace 'martinlobato.com.ar.clima'
    compileSdk 37

    defaultConfig {
        applicationId "martinlobato.com.ar.clima"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests {
            // Robolectric necesita los recursos reales (layouts, temas) para inflar las pantallas.
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'androidx.work:work-runtime:2.10.5'

    testImplementation 'junit:junit:4.13.2'
    // org.json del android.jar es un stub en tests locales; esta es la implementación real.
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.work:work-testing:2.10.5'
}
